<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Demos</title>
  <link rel="stylesheet" href="restaurant-demo/css/app.css">
  <style>
    .landing { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; padding:40px 20px; }
    .demo-link { display:block; padding:24px 32px; background:var(--bg-card); border-radius:16px; width:100%; max-width:360px; text-decoration:none; color:var(--text); transition:0.2s; }
    .demo-link:hover { background:var(--bg-light); transform:translateY(-2px); }
    .demo-link h2 { margin:0 0 8px; font-size:20px; }
    .demo-link p { margin:0; font-size:13px; color:var(--text-muted); }
  </style>
</head>
<body>
  <div class="landing">
    <h1>App Demos</h1>
    <a class="demo-link" href="demo-template/">
      <h2>&#127891; University Portal</h2>
      <p>Student/graduate mobile app demo</p>
    </a>
  </div>
</body>
</html>
